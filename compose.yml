# unleash — Feature flag management (Unleash server + private Postgres)
# Local:  make all   (or make setup && make up && make validate)
# Prod:   .env provisioned externally; make up   (declared in infra-kubernetes)
#
# Bridge network internal to the stack; only the server publishes a port —
# loopback only (:4242). The private Postgres is unreachable from outside.
name: unleash

services:

  unleash:
    image: unleashorg/unleash-server:6.4.1
    container_name: unleash
    restart: unless-stopped
    depends_on:
      unleash-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash:${UNLEASH_DB_PASSWORD}@unleash-postgres:5432/unleash
      DATABASE_SSL: "false"
      # Flags-as-code: import the declarative seed on startup
      UNLEASH_IMPORT_FILE: /import/sca-flags.json
      UNLEASH_IMPORT_KEEP_EXISTING: "true"
      UNLEASH_VERSION_CHECK: "false"
      UNLEASH_DEFAULT_ADMIN_USERNAME: ${UNLEASH_ADMIN_USERNAME:-admin}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD}
    volumes:
      - ./unleash/sca-flags.json:/import/sca-flags.json:ro
    ports:
      - "127.0.0.1:${UNLEASH_PORT:-4242}:4242"
    networks:
      - unleash-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4242/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  unleash-postgres:
    image: postgres:16-alpine
    container_name: unleash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: ${UNLEASH_DB_PASSWORD}
      POSTGRES_DB: unleash
    volumes:
      - unleash-pg-data:/var/lib/postgresql/data
    networks:
      - unleash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  unleash-network:
    driver: bridge

volumes:
  unleash-pg-data:
